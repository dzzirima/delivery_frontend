<div>
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Deliveries</h1>
      <p class="text-gray-500 text-sm mt-0.5">Manage and track all deliveries.</p>
    </div>
    <button class="flex items-center gap-2 bg-[#4f46e5] hover:bg-indigo-700 text-white font-semibold px-5 py-2.5 rounded-xl transition-colors text-sm shadow-md shadow-indigo-200">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
      </svg>
      New Delivery
    </button>
  </div>

  <app-order-filters [active]="activeFilter()" (filterChange)="activeFilter.set($event)" />
  <app-order-table [filter]="activeFilter()" />
</div>
