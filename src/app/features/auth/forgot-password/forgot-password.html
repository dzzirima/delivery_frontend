<div class="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-purple-50 flex flex-col items-center justify-center px-4 py-12">

  <!-- Icon -->
  <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center mb-6 shadow-lg shadow-indigo-200">
    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
    </svg>
  </div>

  <h1 class="text-3xl font-extrabold text-gray-900 mb-2">Forgot your password?</h1>
  <p class="text-gray-500 mb-8 text-center max-w-sm">
    No worries — enter your email or phone number and we'll send you a reset code.
  </p>

  <!-- Card -->
  <div class="bg-white rounded-2xl shadow-xl shadow-gray-100 border border-gray-100 w-full max-w-md p-8">
    <form class="space-y-5" (ngSubmit)="submit()">

      <!-- Identifier -->
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1.5">
          {{ isPhone ? 'Phone number' : 'Email address' }}
        </label>
        <input
          type="text"
          [(ngModel)]="identifier"
          name="identifier"
          [placeholder]="isPhone ? '+263 77 123 4567' : 'you@example.com'"
          class="w-full border border-gray-200 rounded-xl px-4 py-3 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition text-sm"
        />
        @if (isPhone) {
          <p class="text-xs text-gray-400 mt-1.5">e.g. +263 77 123 4567 or 077 123 4567</p>
        }
      </div>

      <!-- Error -->
      @if (error()) {
        <p class="text-sm text-red-600 bg-red-50 rounded-xl px-4 py-2.5 border border-red-100">{{ error() }}</p>
      }

      <!-- Submit -->
      <button
        type="submit"
        [disabled]="loading()"
        class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:opacity-60 text-white font-semibold py-3.5 rounded-xl transition-colors text-sm shadow-md shadow-indigo-200"
      >
        {{ loading() ? 'Sending code…' : 'Send reset code' }}
      </button>

    </form>
  </div>

  <!-- Back to sign in -->
  <p class="text-sm text-gray-500 mt-6">
    Remembered it?
    <a routerLink="/signin" class="text-indigo-600 font-semibold hover:text-indigo-700">Back to sign in</a>
  </p>

</div>
