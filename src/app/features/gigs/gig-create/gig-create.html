<div class="p-6 max-w-2xl mx-auto">

  <!-- Breadcrumb -->
  <div class="flex items-center gap-2 mb-6 text-sm">
    <button (click)="cancel()"
      class="flex items-center gap-1.5 text-gray-500 hover:text-gray-900 transition-colors font-medium">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
      Back to Application
    </button>
    <span class="text-gray-300">/</span>
    <span class="text-gray-900 font-semibold">Create Gig</span>
  </div>

  <!-- Context header -->
  @if (company) {
    <div class="bg-violet-50 border border-violet-100 rounded-2xl px-5 py-4 mb-6">
      <p class="text-xs font-semibold text-violet-500 uppercase tracking-wide mb-0.5">Creating gig for</p>
      <p class="text-base font-bold text-gray-900">{{ company }}</p>
      @if (position) {
        <p class="text-sm text-gray-500">{{ position }}</p>
      }
    </div>
  }

  @if (error()) {
    <p class="text-sm text-red-600 bg-red-50 border border-red-100 rounded-xl px-4 py-3 mb-5">{{ error() }}</p>
  }

  <!-- Form -->
  <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6">
    <form (ngSubmit)="submit()" class="space-y-5">

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wide">
            Starting Date <span class="text-red-400">*</span>
          </label>
          <input [(ngModel)]="form.startingDate" name="startingDate" type="date" required
            class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-violet-500" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wide">
            Duration (months) <span class="text-red-400">*</span>
          </label>
          <input [(ngModel)]="form.duration" name="duration" type="number" min="1" required
            class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-violet-500" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wide">
            Pay Rate ($/hr) <span class="text-red-400">*</span>
          </label>
          <input [(ngModel)]="form.payRate" name="payRate" type="number" step="0.01" min="0" required
            class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-violet-500" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wide">
            Overtime Rate (×) <span class="text-red-400">*</span>
          </label>
          <input [(ngModel)]="form.overtimeRate" name="overtimeRate" type="number" step="0.1" min="1" required
            class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-violet-500" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wide">
            Equipment Type <span class="text-red-400">*</span>
          </label>
          <select [(ngModel)]="form.equipmentType" name="equipmentType"
            class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-violet-500 bg-white">
            @for (t of equipmentTypes; track t) {
              <option [value]="t">{{ equipmentLabel(t) }}</option>
            }
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wide">
            Max Hours / Day
          </label>
          <input [(ngModel)]="form.maximumHoursPerDay" name="maximumHoursPerDay" type="number" min="1" max="24"
            placeholder="Optional"
            class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-violet-500" />
        </div>

        <div class="sm:col-span-2">
          <label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wide">
            Possibility of Extension <span class="text-red-400">*</span>
          </label>
          <select [(ngModel)]="form.possibilityOfExtension" name="possibilityOfExtension"
            class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-violet-500 bg-white">
            <option [ngValue]="false">No</option>
            <option [ngValue]="true">Yes</option>
          </select>
        </div>

        <div class="sm:col-span-2">
          <label class="block text-xs font-semibold text-gray-600 mb-1.5 uppercase tracking-wide">
            Computer / Equipment Information
          </label>
          <textarea [(ngModel)]="form.computerInformation" name="computerInformation" rows="3"
            placeholder="Optional — describe equipment details, specs, etc."
            class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-violet-500 resize-none"></textarea>
        </div>

      </div>

      <div class="flex items-center justify-end gap-3 pt-2 border-t border-gray-100">
        <button type="button" (click)="cancel()"
          class="px-5 py-2.5 rounded-xl text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors">
          Cancel
        </button>
        <button type="submit"
          [disabled]="saving() || !form.startingDate || !form.payRate || !form.duration"
          class="px-6 py-2.5 rounded-xl text-sm font-semibold bg-violet-600 text-white hover:bg-violet-700 disabled:opacity-50 transition-colors shadow-sm shadow-violet-200">
          {{ saving() ? 'Creating…' : 'Create Gig' }}
        </button>
      </div>

    </form>
  </div>

</div>
