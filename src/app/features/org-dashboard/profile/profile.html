<div class="max-w-xl">

  <!-- Header -->
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-900">My Profile</h1>
    <p class="text-sm text-gray-500 mt-0.5">Update your personal details.</p>
  </div>

  <!-- Card -->
  <div class="bg-white rounded-2xl border border-gray-200 p-6 space-y-5">

    <!-- Avatar row -->
    <div class="flex items-center gap-4 pb-5 border-b border-gray-100">
      <div class="w-14 h-14 rounded-full bg-green-100 text-green-700 text-xl font-bold flex items-center justify-center shrink-0">
        {{ form.name ? form.name.charAt(0).toUpperCase() : '?' }}
      </div>
      <div>
        <p class="font-semibold text-gray-900">{{ form.name || '—' }}</p>
        <p class="text-sm text-gray-400">{{ form.email || '—' }}</p>
      </div>
    </div>

    <!-- Name -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1.5">Full Name</label>
      <input
        type="text"
        [(ngModel)]="form.name"
        placeholder="Your name"
        class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-sm text-gray-700 placeholder:text-gray-400
               focus:outline-none focus:border-green-500 focus:ring-2 focus:ring-green-500/20 transition-colors"
      />
    </div>

    <!-- Email (read-only) -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1.5">
        Email
        <span class="ml-1.5 text-xs font-normal text-gray-400">(cannot be changed here)</span>
      </label>
      <input
        type="email"
        [value]="form.email"
        disabled
        class="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-sm text-gray-400 bg-gray-50 cursor-not-allowed"
      />
    </div>

    <!-- Phone -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1.5">Phone Number</label>
      <input
        type="tel"
        [(ngModel)]="form.phoneNumber"
        placeholder="+263 77 123 4567"
        class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-sm text-gray-700 placeholder:text-gray-400
               focus:outline-none focus:border-green-500 focus:ring-2 focus:ring-green-500/20 transition-colors"
      />
    </div>

    <!-- Address -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1.5">Address</label>
      <input
        type="text"
        [(ngModel)]="form.address"
        placeholder="Your address"
        class="w-full px-3.5 py-2.5 rounded-xl border border-gray-300 text-sm text-gray-700 placeholder:text-gray-400
               focus:outline-none focus:border-green-500 focus:ring-2 focus:ring-green-500/20 transition-colors"
      />
    </div>

    <!-- Save button -->
    <div class="pt-1 flex justify-end">
      <button
        (click)="save()"
        [disabled]="saving()"
        class="flex items-center gap-2 px-5 py-2.5 text-sm font-semibold text-white bg-green-600 hover:bg-green-700
               disabled:opacity-60 disabled:cursor-not-allowed rounded-xl transition-colors"
      >
        @if (saving()) {
          <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
          </svg>
          Saving…
        } @else {
          Save Changes
        }
      </button>
    </div>

  </div>

</div>
