# Host nginx: /etc/nginx/sites-available/zagaah.com  (then symlink into sites-enabled)
server {
  listen 80;
  server_name zagaah.com www.zagaah.com;

  location / {
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
# After this, run:  certbot --nginx -d zagaah.com -d www.zagaah.com
# certbot adds HTTPS and the http->https redirect automatically.
